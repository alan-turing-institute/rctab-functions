[project]
name = "rctab-usage-function"
version = "0.1.0"  # Do not change
description = "Function app to collect usage data"
authors = []

[tool.poetry]
# Oldest Poetry that may work on this project.
# Bump it by hand when we need a newer Poetry feature.
requires-poetry = ">=2.4"
packages = [
    {include = "usage"},
    {include = "utils"},
    {include = "monthly_usage"},
    #    {include = "costmanagement"},
]

[tool.poetry.dependencies]
python = "^3.13"
azure-functions = "^1.19.0"
azure-identity = "^1.16.0"
azure-mgmt-costmanagement = "^5.0.0"
azure-mgmt-managementgroups = "^2.0.0"
azure-mgmt-subscription = "^3.1.1"
pydantic = "^2.11.5"
pydantic-settings = "^2.9.1"
PyJWT = {extras = ["crypto"], version = "^2.8.0"}
requests = "^2.33.1"
rctab_models = { git = "https://github.com/alan-turing-institute/rctab-models", tag = "0.4.0" }
azure-storage-blob = "^12.28.0"

[tool.poetry.group.dev.dependencies]
coverage = "^7.5.1"
isort = "^9.0.0"
mypy = "^2.0.0"
pre-commit = "^4.0.0"
pylint = "^4.0.0"
types-requests = "^2.33.0.20260408"  # Should match requests version

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
