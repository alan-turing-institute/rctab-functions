[project]
name = "rctab-status-function"
version = "0.1.0"  # Do not change
description = "Function app to collect status data"
authors = []

[tool.poetry]
# Oldest Poetry that may work on this project. Not managed by Renovate:
# bump it by hand when we need a newer Poetry feature.
requires-poetry = ">=2.4"
packages = [
    {include = "status"},
]

[tool.poetry.dependencies]
python = "^3.13"
azure-functions = "^1.23.0"
azure-identity = "^1.21.0"
azure-mgmt-authorization = "^4.0.0"
azure-mgmt-subscription = "^3.1.1"
msgraph-sdk = "^1.28.0"
pydantic = "^2.11.5"
pydantic-settings = "^2.9.1"
PyJWT = {extras = ["crypto"], version = "^2.10.1"}
requests = "^2.32.3"
rctab_models = { git = "https://github.com/alan-turing-institute/rctab-models", tag = "0.4.0" }

[tool.poetry.group.dev.dependencies]
coverage = "^7.8.0"
isort = "^9.0.0"
mypy = "^2.0.0"
pylint = "^4.0.0"
types-requests = "^2.32.0.20250328"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
